<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의약품 검색 시스템 - 로그인</title>
    
    <!-- 포맷팅 함수 먼저 정의 -->
    <script>
        // 핸드폰번호 자동 포맷팅
        function formatPhone(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length > 11) value = value.slice(0, 11);
            
            let formatted = '';
            if (value.length <= 3) {
                formatted = value;
            } else if (value.length <= 7) {
                formatted = value.slice(0, 3) + '-' + value.slice(3);
            } else {
                formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
            }
            input.value = formatted;
        }

        // 사업자번호 자동 포맷팅
        function formatBusinessNumber(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            if (value.length > 10) value = value.slice(0, 10);
            
            let formatted = '';
            if (value.length <= 3) {
                formatted = value;
            } else if (value.length <= 5) {
                formatted = value.slice(0, 3) + '-' + value.slice(3);
            } else {
                formatted = value.slice(0, 3) + '-' + value.slice(3, 5) + '-' + value.slice(5);
            }
            input.value = formatted;
        }
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-container {
            padding: 40px 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f8f9fa;
            color: #6c757d;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00BCD4;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00BCD4 0%, #0097A7 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .help-text {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin:0; font-size:28px; font-weight:800; letter-spacing:-1px; color:white;">웰스팜 CSO 수수료 검색</h1>
            <p style="margin:8px 0 0; font-size:14px; opacity:0.85; color:white;">로그인 후 이용하실 수 있습니다</p>
        </div>

        <div class="form-container">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">로그인</button>
                <button class="tab" onclick="switchTab('signup')">회원가입</button>
            </div>

            <div id="message" class="message"></div>

            <!-- 로그인 폼 -->
            <div id="loginForm" class="form-section active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">이메일</label>
                        <input type="email" id="loginEmail" required placeholder="example@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">비밀번호</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-bottom: 0;">
                        <input type="checkbox" id="autoLogin" style="width: auto; margin: 0;">
                        <label for="autoLogin" style="margin: 0; cursor: pointer; font-weight: normal;">자동 로그인</label>
                    </div>
                    <button type="submit" class="btn btn-primary">로그인</button>
                </form>
            </div>

            <!-- 회원가입 폼 -->
            <div id="signupForm" class="form-section">
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="signupEmail">이메일 *</label>
                        <input type="email" id="signupEmail" required placeholder="example@gmail.com">
                        <div class="help-text">구글, 애플 등 모든 이메일 사용 가능</div>
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">비밀번호 *</label>
                        <input type="password" id="signupPassword" required minlength="6">
                        <div class="help-text">최소 6자 이상</div>
                    </div>
                    <div class="form-group">
                        <label for="signupPasswordConfirm">비밀번호 확인 *</label>
                        <input type="password" id="signupPasswordConfirm" required>
                    </div>
                    <div class="form-group">
                        <label for="signupName">이름 *</label>
                        <input type="text" id="signupName" required placeholder="홍길동">
                    </div>
                    <div class="form-group">
                        <label for="signupPhone">핸드폰번호 *</label>
                        <input type="tel" id="signupPhone" required placeholder="010-0000-0000" maxlength="13">
                        <div class="help-text">숫자만 입력하면 자동으로 하이픈이 추가됩니다</div>
                    </div>
                    <div class="form-group">
                        <label for="signupCompany">회사명 *</label>
                        <input type="text" id="signupCompany" required placeholder="웰스팜">
                    </div>
                    <div class="form-group">
                        <label for="signupBusinessNumber">사업자번호 *</label>
                        <input type="text" id="signupBusinessNumber" required placeholder="000-00-00000" maxlength="12">
                        <div class="help-text">숫자만 입력하면 자동으로 하이픈이 추가됩니다</div>
                    </div>
                    <button type="submit" class="btn btn-primary">회원가입</button>
                    <div class="help-text" style="text-align: center; margin-top: 15px;">
                        * 회원가입 후 관리자 승인이 필요합니다
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, setPersistence, browserLocalPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDUKRghcAAYZoYShaKK0LxzBFH-4Ro_McY",
            authDomain: "wellspharm-cso.firebaseapp.com",
            projectId: "wellspharm-cso",
            storageBucket: "wellspharm-cso.firebasestorage.app",
            messagingSenderId: "17466141351",
            appId: "1:17466141351:web:fe02abc304f13d4d2ec982"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.handleLogin = async function(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const autoLogin = document.getElementById('autoLogin').checked;
            
            try {
                // 자동 로그인 설정
                if (autoLogin) {
                    // 모바일인지 PC인지 감지
                    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    
                    if (isMobile) {
                        // 모바일: 영구 로그인 유지 (로그아웃 버튼까지)
                        await setPersistence(auth, browserLocalPersistence);
                    } else {
                        // PC: 7일 후 자동 로그아웃
                        await setPersistence(auth, browserLocalPersistence);
                        // 7일 후 만료 시간 저장
                        const expiryDate = new Date();
                        expiryDate.setDate(expiryDate.getDate() + 7);
                        localStorage.setItem('loginExpiry', expiryDate.getTime().toString());
                    }
                } else {
                    // 자동 로그인 미체크: 브라우저 닫으면 로그아웃
                    await setPersistence(auth, browserSessionPersistence);
                }
                
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // 사용자 승인 상태 확인
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                
                if (!userDoc.exists()) {
                    showMessage('error', '사용자 정보를 찾을 수 없습니다.');
                    await auth.signOut();
                    return;
                }
                
                const userData = userDoc.data();
                
                if (!userData.approved) {
                    showMessage('info', '관리자 승인 대기 중입니다. 승인 후 로그인이 가능합니다.');
                    await auth.signOut();
                    return;
                }
                
                // 관리자 여부 확인
                if (userData.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'search.html';
                }
                
            } catch (error) {
                console.error('로그인 오류:', error);
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showMessage('error', '이메일 또는 비밀번호가 올바르지 않습니다.');
                } else {
                    showMessage('error', '로그인 중 오류가 발생했습니다: ' + error.message);
                }
            }
        };

        window.handleSignup = async function(event) {
            event.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;
            const phone = document.getElementById('signupPhone').value;
            const company = document.getElementById('signupCompany').value;
            const businessNumber = document.getElementById('signupBusinessNumber').value;
            
            if (password !== passwordConfirm) {
                showMessage('error', '비밀번호가 일치하지 않습니다.');
                return;
            }
            
            // 핸드폰번호 형식 검증
            const phonePattern = /^010-\d{4}-\d{4}$/;
            if (!phonePattern.test(phone)) {
                showMessage('error', '핸드폰번호 형식이 올바르지 않습니다. (예: 010-1234-5678)');
                return;
            }
            
            // 사업자번호 형식 검증
            const businessNumberPattern = /^\d{3}-\d{2}-\d{5}$/;
            if (!businessNumberPattern.test(businessNumber)) {
                showMessage('error', '사업자번호 형식이 올바르지 않습니다. (예: 123-45-67890)');
                return;
            }
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // 프로필 업데이트
                await updateProfile(user, { displayName: name });
                
                // Firestore에 사용자 정보 저장
                await setDoc(doc(db, 'users', user.uid), {
                    name: name,
                    email: email,
                    phone: phone,
                    company: company,
                    businessNumber: businessNumber,
                    role: 'user',
                    approved: false,
                    createdAt: new Date().toISOString()
                });
                
                showMessage('success', '회원가입이 완료되었습니다! 관리자 승인 후 로그인이 가능합니다.');
                
                // 로그아웃
                await auth.signOut();
                
                // 폼 초기화
                const signupFormEl = document.querySelector('#signupForm form'); if (signupFormEl) signupFormEl.reset();
                
                // 3초 후 로그인 탭으로 전환
                setTimeout(() => {
                    switchTab('login');
                }, 3000);
                
            } catch (error) {
                console.error('회원가입 오류:', error);
                if (error.code === 'auth/email-already-in-use') {
                    showMessage('error', '이미 사용 중인 이메일입니다.');
                } else if (error.code === 'auth/weak-password') {
                    showMessage('error', '비밀번호가 너무 약합니다. 6자 이상 입력해주세요.');
                } else {
                    showMessage('error', '회원가입 중 오류가 발생했습니다: ' + error.message);
                }
            }
        };

        function showMessage(type, message) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'message ' + type;
            messageDiv.textContent = message;
        }

        // 핸드폰번호 자동 포맷팅
        function formatPhone(input) {
            // 숫자만 추출
            let value = input.value.replace(/[^0-9]/g, '');
            
            // 11자리 제한
            if (value.length > 11) {
                value = value.slice(0, 11);
            }
            
            // 포맷팅
            let formatted = '';
            if (value.length <= 3) {
                formatted = value;
            } else if (value.length <= 7) {
                formatted = value.slice(0, 3) + '-' + value.slice(3);
            } else {
                formatted = value.slice(0, 3) + '-' + value.slice(3, 7) + '-' + value.slice(7);
            }
            
            input.value = formatted;
        }

        // 사업자번호 자동 포맷팅
        function formatBusinessNumber(input) {
            // 숫자만 추출
            let value = input.value.replace(/[^0-9]/g, '');
            
            // 10자리 제한
            if (value.length > 10) {
                value = value.slice(0, 10);
            }
            
            // 포맷팅 (000-00-00000)
            let formatted = '';
            if (value.length <= 3) {
                formatted = value;
            } else if (value.length <= 5) {
                formatted = value.slice(0, 3) + '-' + value.slice(3);
            } else {
                formatted = value.slice(0, 3) + '-' + value.slice(3, 5) + '-' + value.slice(5);
            }
            
            input.value = formatted;
        }

        // 페이지 로드 후 이벤트 리스너 추가
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('signupPhone');
            const businessInput = document.getElementById('signupBusinessNumber');
            
            if (phoneInput) {
                phoneInput.addEventListener('input', function() {
                    formatPhone(this);
                });
            }
            
            if (businessInput) {
                businessInput.addEventListener('input', function() {
                    formatBusinessNumber(this);
                });
            }
        });

        window.switchTab = function(tab) {
            // 탭 활성화
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // 폼 전환
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('signupForm').classList.add('active');
            }
            
            // 메시지 초기화
            document.getElementById('message').className = 'message';
        };
    </script>
</body>
</html>
